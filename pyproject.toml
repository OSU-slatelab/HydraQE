[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydraqe"
version = "1.0.0"
description = "Inference API for the HydraQE speech translation quality estimator"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "entmax>=1.3,<2",
    "huggingface-hub>=0.36,<2",
    "librosa>=0.11,<1",
    "numpy>=1.26,<3",
    "peft>=0.15,<1",
    "qwen-asr>=0.0.6,<0.1",
    "safetensors>=0.7,<1",
    "soundfile>=0.13,<1",
    "torch>=2.6,<3",
    "transformers>=4.57,<5",
]

[project.scripts]
hydraqe = "hydraqe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hydraqe"]

[tool.ruff]
target-version = "py310"
